name: Build zips (manual upload)

# Builds api.zip, storefront.zip and dashboard.zip as downloadable artifacts for
# uploading by hand in cPanel File Manager. The repo is public, so api.zip has
# no .env: create it on the server from .env.example.

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths: [.github/workflows/build-zips.yml]

env:
    API_URL: ${{ vars.API_URL || 'https://api.mangrove-collection.com' }}
    SITE_URL: ${{ vars.SITE_URL || 'https://mangrove-collection.com' }}
    DASHBOARD_URL: ${{ vars.DASHBOARD_URL || 'https://dashboard.mangrove-collection.com' }}

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.2"
                  extensions: mbstring, gd, fileinfo, zip
                  coverage: none
            - uses: pnpm/action-setup@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: api.zip
              working-directory: backend-api
              run: |
                  mkdir -p ../out
                  composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist
                  # The subdomain's document root is this folder, not public/.
                  printf 'RewriteEngine On\nRewriteRule ^(.*)$ public/$1 [L]\n' > .htaccess
                  zip -qr ../out/api.zip . \
                    -x 'tests/*' 'node_modules/*' '.git/*' '.env' '.agents/*' '.claude/*' '.windsurf/*' '.cursor/*' \
                       'storage/app/public/*' 'storage/logs/*.log' 'storage/framework/*/*' \
                       'public/uploads/*' 'public/storage' 'phpunit.xml'

            # Hoisted node_modules: cPanel's unzip can't restore pnpm's symlinks.
            - run: pnpm install --frozen-lockfile --config.node-linker=hoisted

            - name: storefront.zip
              env:
                  NEXT_OUTPUT: standalone
                  NEXT_PUBLIC_API_URL: ${{ env.API_URL }}/v1
                  NEXT_PUBLIC_SITE_URL: ${{ env.SITE_URL }}
                  NEXT_PUBLIC_DASHBOARD_URL: ${{ env.DASHBOARD_URL }}
              run: |
                  pnpm --filter frontend build
                  server=$(find frontend/.next/standalone -name server.js -not -path '*/node_modules/*' | head -n1)
                  app_dir=$(dirname "${server#frontend/.next/standalone/}")
                  mkdir -p bundle/app
                  cp -a frontend/.next/standalone/. bundle/app/
                  cp -a frontend/.next/static "bundle/app/$app_dir/.next/static"
                  cp -a frontend/public "bundle/app/$app_dir/public"
                  echo "require(\"./app/$app_dir/server.js\");" > bundle/server.js
                  (cd bundle && zip -qr ../out/storefront.zip .)

            - name: dashboard.zip
              env:
                  VITE_API_URL: ${{ env.API_URL }}/v1
                  VITE_STOREFRONT_URL: ${{ env.SITE_URL }}
              run: |
                  pnpm --filter dashboard build
                  (cd dashboard/dist && zip -qr ../../out/dashboard.zip .)

            - uses: actions/upload-artifact@v4
              with:
                  name: mangrove-zips
                  path: out/*.zip
                  retention-days: 7
